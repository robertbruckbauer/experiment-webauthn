services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  backend:
    image: eclipse-temurin:25-jdk
    working_dir: /workspace/backend
    command: ["./gradlew", "bootRun"]
    environment:
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/webauthn
      OAUTH2_AUDIENCE: backend-api
      OAUTH2_CLIENT_ID: frontend-spa
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./:/workspace
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_healthy

  frontend:
    image: node:24
    working_dir: /workspace/frontend
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"]
    environment:
      VITE_PROXY_API_TARGET: http://backend:8080
      VITE_KEYCLOAK_URL: http://localhost:8081
      VITE_KEYCLOAK_REALM: webauthn
      VITE_KEYCLOAK_CLIENT_ID: frontend-spa
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5173"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  frontend_node_modules:
